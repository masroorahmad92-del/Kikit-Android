[mypy]
python_version = 3.12
# Many third-party packages used here (cloudinary, redis, celery, firebase,
# sqladmin, geoalchemy2, sendgrid, boto3, fastapi_pagination, passlib,
# psycopg2) do not ship type stubs. Suppress those import errors globally
# rather than adding per-module ignores for every package.
ignore_missing_imports = True
disable_error_code = import-untyped
exclude = ^alembic/
